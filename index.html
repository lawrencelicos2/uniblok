<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay – browse through Cloudflare</title>
<style>
:root{--bg:#e9eef1;--panel:#f8fafb;--ink:#14222c;--muted:#5b6b76;--line:#c5d0d7;--accent:#b4400f;--err:#b42318;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a21;--panel:#16252f;--ink:#e6eef3;--muted:#8fa3b0;--line:#2a3d4a;--accent:#ff8a57;--err:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.8rem;margin:0 0 14px;letter-spacing:-.02em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;padding:10px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;color:#fff;background:var(--accent)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
input:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1}
.row{display:flex;align-items:center;gap:8px;font-size:.88rem;margin-bottom:10px}
.row label{margin:0;font-weight:400}
#viewport{background:#fff;border:1px solid var(--line);border-radius:6px;min-height:360px;overflow:auto}
.note{font-size:.8rem;color:var(--muted);margin-top:8px}
details summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Relay</h1>

  <details class="panel" id="settings">
    <summary>Worker settings</summary>
    <label for="wurl">Worker address</label>
    <input id="wurl" type="text" value="https://uniblok-relay.lawrencelicos2.workers.dev/?url=" autocomplete="off">
    <label for="wkey">Worker key</label>
    <input id="wkey" type="password" value="ef0b1965-1c57-4e44-b927-54baebd516d2e2bc2033-5cb1-44b1-ae7d-df24e720a7d3" autocomplete="off">
    <p class="note">Saved in this browser only.</p>
  </details>

  <div class="panel">
    <div class="bar">
      <button class="ghost" id="back" aria-label="Back">&larr;</button>
      <input id="q" type="text" placeholder="Search the web or enter a web address" autocomplete="off">
      <button id="go">Go</button>
    </div>
    <div class="row"><input id="imgs" type="checkbox"><label for="imgs">Load images (they load straight from the site, not through Cloudflare)</label></div>
    <div id="viewport"></div>
    <div class="note" id="note"></div>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };
  if (store.get('wurl')) $('wurl').value = store.get('wurl');
  if (store.get('wkey')) $('wkey').value = store.get('wkey');
  $('wurl').onchange = () => store.set('wurl', $('wurl').value.trim());
  $('wkey').onchange = () => store.set('wkey', $('wkey').value);

  const shadow = $('viewport').attachShadow({mode:'open'});
  shadow.innerHTML = `<style>
    .page{padding:18px 22px;font:16px/1.55 Georgia,serif;color:#111;overflow-wrap:anywhere}
    a{color:#0645ad;cursor:pointer;text-decoration:underline}
    img,video{max-width:100%;height:auto} table{max-width:100%}
    .msg{padding:24px;font-family:system-ui,sans-serif;color:#444} .msg.err{color:#b42318}
  </style><div class="page" id="p"></div>`;
  const pageEl = shadow.getElementById('p');
  const hist = [];

  const looksLikeUrl = s => /^https?:\/\//i.test(s) || (!/\s/.test(s) && /^[^\s/]+\.[a-z]{2,}(\/.*)?$/i.test(s));
  const toUrl = s => {
    s = s.trim();
    if (looksLikeUrl(s)) return /^https?:\/\//i.test(s) ? s : 'https://' + s;
    return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(s);
  };
  function resolveHref(href, base){
    try{
      const u = new URL(href, base);
      if (u.hostname.endsWith('duckduckgo.com') && u.pathname === '/l/' && u.searchParams.get('uddg')) return u.searchParams.get('uddg');
      return /^https?:$/.test(u.protocol) ? u.href : null;
    }catch{ return null; }
  }
  function showMsg(text, err){
    pageEl.innerHTML = '';
    const d = document.createElement('div'); d.className = 'msg' + (err ? ' err' : ''); d.textContent = text;
    pageEl.append(d);
  }
  function render(html, base){
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style,iframe,frame,object,embed,form,link,meta,base,noscript,svg,canvas,template').forEach(n => n.remove());
    if (!$('imgs').checked) doc.querySelectorAll('img,picture,source,video,audio').forEach(n => n.remove());
    doc.querySelectorAll('*').forEach(el => {
      for (const a of [...el.attributes]){
        const n = a.name.toLowerCase();
        if (n.startsWith('on') || ['style','srcset','class','id'].includes(n)) el.removeAttribute(a.name);
      }
      if (el.tagName === 'A'){
        const h = resolveHref(el.getAttribute('href') || '', base);
        el.removeAttribute('href'); if (h) el.dataset.go = h;
      } else if (el.tagName === 'IMG'){
        const s = resolveHref(el.getAttribute('src') || '', base);
        if (s){ el.setAttribute('src', s); el.setAttribute('referrerpolicy','no-referrer'); } else el.remove();
      }
    });
    pageEl.innerHTML = '';
    pageEl.append(...doc.body.childNodes);
  }

  async function navigate(input, push = true){
    const worker = $('wurl').value.trim(), key = $('wkey').value;
    if (!worker || !key){ $('settings').open = true; showMsg('Enter your Worker address and key first.', true); return; }
    store.set('wurl', worker); store.set('wkey', key);
    const url = toUrl(input);
    $('note').textContent = 'Fetching…'; showMsg('Loading…');
    try{
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
      const r = await fetch(worker + encodeURIComponent(url), {headers:{'x-key':key}, signal: ctl.signal});
      clearTimeout(t);
      if (r.status === 401) throw new Error('Wrong Worker key.');
      let text = await r.text();
      if (text.length > 1500000) text = text.slice(0, 1500000);
      const type = r.headers.get('content-type') || '';
      if (/json|plain/.test(type) && !/html/.test(type)){
        pageEl.innerHTML = ''; const pre = document.createElement('pre'); pre.style.whiteSpace = 'pre-wrap'; pre.textContent = text; pageEl.append(pre);
      } else if (/html|xml/.test(type)) render(text, url);
      else throw new Error('That address is a file, not a page.');
      if (push) hist.push(url);
      $('q').value = url.startsWith('https://html.duckduckgo.com/html/') ? decodeURIComponent(url.split('q=')[1] || '') : url;
      $('note').textContent = 'Fetched through your Cloudflare Worker.';
      $('viewport').scrollTop = 0;
    }catch(e){
      showMsg(e.name === 'AbortError' ? 'The Worker took too long.' : e.message, true);
      $('note').textContent = '';
    }
  }

  shadow.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a');
    if (a && a.dataset.go){ e.preventDefault(); navigate(a.dataset.go); }
  });
  $('go').onclick = () => { if ($('q').value.trim()) navigate($('q').value); };
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
  $('back').onclick = () => { if (hist.length > 1){ hist.pop(); navigate(hist.pop(), true); } };
})();
</script>
</body>
</html>
