<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uni-Blok</title>
<style>
:root{
  color-scheme: dark;
  --bg:#1c1c1c; --panel:#242424; --ink:#ffffff; --muted:#b3b3b3; --line:#ffffff; --accent:#ffffff; --err:#ff8a8a;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);line-height:1.5;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
.topbar h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.topbar .bar{display:flex;flex:1;gap:8px}
.topbar input[type=text]{flex:1;min-width:0}
input[type=text],input[type=password]{padding:9px 12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px}
button{font:inherit;font-weight:600;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;color:#111;background:var(--accent)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);white-space:nowrap}
.row label{font-weight:400}
details.settings{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;flex:0 0 auto}
details.settings summary{cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
details.settings .fields{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
details.settings .fields > div{flex:1;min-width:220px}
details.settings label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px}
.note{font-size:.78rem;color:var(--muted);padding:4px 14px}
.note.err{color:var(--err)}
#stage{flex:1 1 auto;min-height:0;display:flex}
#viewport{flex:1;background:#fff;overflow:auto}
#frame{flex:1;width:100%;border:0;background:#fff;display:none}
@media(max-width:700px){
  .topbar{flex-wrap:wrap}
  .topbar h1{flex:0 0 100%}
}
</style>
</head>
<body>
  <div class="topbar">
    <h1>Uni-Blok</h1>
    <button class="ghost" id="back" aria-label="Back">&larr;</button>
    <div class="bar">
      <input id="q" type="text" placeholder="Search Google or enter a web address" autocomplete="off">
    </div>
    <button id="go">Go</button>
    <div class="row"><input id="imgs" type="checkbox"><label for="imgs">Images</label></div>
    <div class="row"><input id="cookies" type="checkbox"><label for="cookies">Allow cookies</label></div>
    <div class="row"><input id="native" type="checkbox"><label for="native">Native view</label></div>
  </div>

  <details class="settings" id="settings">
    <summary>Worker settings</summary>
    <div class="fields">
      <div>
        <label for="wurl">Worker address</label>
        <input id="wurl" type="text" value="https://uni-blok2.lawrencelicos2.workers.dev/?url=" autocomplete="off" style="width:100%">
      </div>
      <div>
        <label for="wkey">Worker key</label>
        <input id="wkey" type="password" value="ef0b1965-1c57-4e44-b927-54baebd516d2e2bc2033-5cb1-44b1-ae7d-df24e720a7d3" autocomplete="off" style="width:100%">
      </div>
    </div>
    <p class="note" style="padding:6px 0 0">Saved in this browser only. If this ever stops matching your live Worker address, edit it here.</p>
  </details>

  <div id="stage"><div id="viewport"></div><iframe id="frame" title="Page" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-presentation allow-same-origin" allow="fullscreen; autoplay; encrypted-media; picture-in-picture"></iframe></div>
  <div class="note" id="note"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k){ try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };

  const CONFIG_VERSION = '4';
  if (store.get('cfgVersion') !== CONFIG_VERSION) {
    store.set('cfgVersion', CONFIG_VERSION);
    store.set('wurl', $('wurl').value);
    store.set('wkey', $('wkey').value);
  } else {
    if (store.get('wurl')) $('wurl').value = store.get('wurl');
    if (store.get('wkey')) $('wkey').value = store.get('wkey');
  }
  $('wurl').onchange = () => store.set('wurl', $('wurl').value.trim());
  $('wkey').onchange = () => store.set('wkey', $('wkey').value);
  $('imgs').checked = store.get('imgs') === '1';
  $('imgs').onchange = () => store.set('imgs', $('imgs').checked ? '1' : '0');
  $('cookies').checked = store.get('cookies') === '1';
  $('native').checked = store.get('native') !== '0';
  $('native').onchange = () => store.set('native', $('native').checked ? '1' : '0');
  $('cookies').onchange = () => store.set('cookies', $('cookies').checked ? '1' : '0');

  const jar = (() => {
    let data = {};
    try { data = JSON.parse(store.get('jar') || '{}'); } catch {}
    return {
      get(domain){ return data[domain] || {}; },
      getHeader(domain){
        const d = this.get(domain);
        return Object.entries(d).map(([k,v]) => k + '=' + v).join('; ');
      },
      merge(domain, setCookies){
        const d = data[domain] || (data[domain] = {});
        for (const sc of setCookies){
          const m = /^([^=]+)=([^;]*)/.exec(sc);
          if (m) d[m[1]] = m[2];
        }
        store.set('jar', JSON.stringify(data));
      }
    };
  })();

  const shadow = $('viewport').attachShadow({mode:'open'});
  shadow.innerHTML = `<style>
    :host{display:block;height:100%}
    .page{padding:18px 22px;font:16px/1.55 Georgia,serif;color:#111;overflow-wrap:anywhere}
    a{color:#0645ad;cursor:pointer;text-decoration:underline}
    img,video{max-width:100%;height:auto} table{max-width:100%}
    .msg{padding:24px;font-family:system-ui,sans-serif;color:#444} .msg.err{color:#b42318}
    .results{font-family:arial,sans-serif;padding:16px 20px}
    .result{margin-bottom:22px;max-width:640px}
    .result .url{color:#006621;font-size:.82rem;margin-bottom:2px;word-break:break-all}
    .result a.title{color:#1a0dab;font-size:1.15rem;text-decoration:none}
    .result a.title:hover{text-decoration:underline}
    .result .snippet{color:#4d5156;font-size:.92rem;margin-top:3px}
    .ddg{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:64px 16px;color:#222}
    .ddg-logo{font-size:2.2rem;font-weight:700;color:#de5833;margin-bottom:22px}
    .ddg input{width:min(520px,90%);padding:12px 18px;font:inherit;color:#222;background:#fff;border:2px solid #de5833;border-radius:26px}
    .ddg button{margin-left:8px;padding:12px 20px;font:inherit;font-weight:600;color:#fff;background:#de5833;border:0;border-radius:26px;cursor:pointer}
    /* YouTube view */
    .yt{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f0f0f}
    .yt-head{display:flex;align-items:center;gap:14px;padding-bottom:14px;margin-bottom:16px;border-bottom:1px solid #e5e5e5;flex-wrap:wrap}
    .yt-logo{display:flex;align-items:center;gap:6px;text-decoration:none;color:#0f0f0f;font-weight:700;font-size:1.25rem;letter-spacing:-.04em}
    .yt-search{display:flex;flex:1;min-width:200px;max-width:560px}
    .yt-search input{flex:1;min-width:0;padding:9px 14px;font:inherit;color:#0f0f0f;background:#fff;border:1px solid #ccc;border-radius:20px 0 0 20px}
    .yt-search button{padding:9px 18px;color:#0f0f0f;background:#f2f2f2;border:1px solid #ccc;border-left:0;border-radius:0 20px 20px 0;cursor:pointer;font:inherit}
    .yt-player{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
    .yt-player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .yt-title{font-size:1.2rem;font-weight:600;margin:12px 0 18px;max-width:960px}
    .yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 16px}
    .yt-card{display:block;color:inherit;text-decoration:none}
    .yt-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddd;border-radius:10px}
    .yt-card .t{font-weight:600;font-size:.95rem;line-height:1.3;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .yt-card .m{font-size:.82rem;color:#606060;margin-top:3px}
    .yt-card:hover .t{text-decoration:underline}
    .yt-empty{color:#606060;padding:12px 0}
  </style><div class="page" id="p"></div>`;
  const pageEl = shadow.getElementById('p');
  const hist = [];

  const looksLikeUrl = s => /^https?:\/\//i.test(s) || (!/\s/.test(s) && /^[^\s/]+\.[a-z]{2,}(\/.*)?$/i.test(s));
  const toUrl = s => {
    s = s.trim();
    if (looksLikeUrl(s)) return /^https?:\/\//i.test(s) ? s : 'https://' + s;
    return 'https://www.bing.com/search?q=' + encodeURIComponent(s);
  };
  function resolveHref(href, base){
    try{
      const u = new URL(href, base);
      if (u.hostname.endsWith('duckduckgo.com') && u.pathname === '/l/' && u.searchParams.get('uddg')) return u.searchParams.get('uddg');
      if (/(^|\.)google\.[a-z.]+$/.test(u.hostname) && u.pathname === '/url' && u.searchParams.get('q')) return u.searchParams.get('q');
      if (/(^|\.)google\.[a-z.]+$/.test(u.hostname) && u.pathname.startsWith('/search')) return null;
      return /^https?:$/.test(u.protocol) ? u.href : null;
    }catch{ return null; }
  }
  function showMsg(text, err){
    pageEl.innerHTML = '';
    const d = document.createElement('div'); d.className = 'msg' + (err ? ' err' : ''); d.textContent = text;
    pageEl.append(d);
  }

  function extractDuckDuckGoResults(doc, base){
    const out = [];
    doc.querySelectorAll('.result, .web-result').forEach(row => {
      const a = row.querySelector('a.result__a, a.result__title, h2 a, a[href]');
      if (!a) return;
      const url = resolveHref(a.getAttribute('href') || '', base);
      if (!url) return;
      const snipEl = row.querySelector('.result__snippet, .result-snippet');
      out.push({ title: a.textContent.trim(), url, snippet: (snipEl ? snipEl.textContent.trim() : '').slice(0, 300) });
    });
    return out;
  }
  // Bing wraps result links in a redirect (bing.com/ck/a?u=a1<base64 url>); unwrap it.
  const bingUnwrap = u => {
    try{
      const x = new URL(u);
      if (/(^|\.)bing\.com$/.test(x.hostname) && x.pathname.startsWith('/ck/')){
        const p = x.searchParams.get('u');
        if (p && p.startsWith('a1')){
          let b = p.slice(2).replace(/-/g, '+').replace(/_/g, '/');
          while (b.length % 4) b += '=';
          return decodeURIComponent(escape(atob(b)));
        }
      }
    }catch{}
    return u;
  };
  function extractBingResults(doc, base){
    const out = [];
    doc.querySelectorAll('li.b_algo').forEach(li => {
      const a = li.querySelector('h2 a');
      if (!a) return;
      const url = resolveHref(a.getAttribute('href') || '', base);
      if (!url) return;
      const sn = li.querySelector('.b_caption p, p');
      out.push({ title: a.textContent.trim(), url: bingUnwrap(url), snippet: (sn ? sn.textContent.trim() : '').slice(0, 300) });
    });
    return out;
  }
  function extractGoogleResults(doc, base){
    const out = [];
    const seen = new Set();
    doc.querySelectorAll('a h3').forEach(h3 => {
      const a = h3.closest('a');
      if (!a) return;
      const url = resolveHref(a.getAttribute('href') || '', base);
      if (!url || seen.has(url)) return;
      let snippet = '';
      let node = a.closest('div');
      for (let i = 0; node && i < 4 && !snippet; i++, node = node.parentElement){
        const sib = node.nextElementSibling;
        if (sib && sib.textContent && sib.textContent.trim().length > 20){
          snippet = sib.textContent.trim();
        }
      }
      seen.add(url);
      out.push({ title: h3.textContent.trim(), url, snippet: snippet.slice(0, 300) });
    });
    return out;
  }

  function renderResults(results){
    pageEl.innerHTML = '';
    const wrap = document.createElement('div'); wrap.className = 'results';
    results.forEach(r => {
      const row = document.createElement('div'); row.className = 'result';
      const urlDiv = document.createElement('div'); urlDiv.className = 'url'; urlDiv.textContent = r.url;
      const a = document.createElement('a'); a.className = 'title'; a.textContent = r.title; a.dataset.go = r.url;
      const snip = document.createElement('div'); snip.className = 'snippet'; snip.textContent = r.snippet;
      row.append(urlDiv, a, snip);
      wrap.append(row);
    });
    pageEl.append(wrap);
  }

  // ---------- YouTube ----------
  // YouTube's HTML is an empty shell; the real content is a JSON blob
  // (ytInitialData) that normally only its JavaScript turns into a page.
  // We read that blob ourselves and draw the logo, search box and video cards.
  const isYouTube = u => { try { return /(^|\.)youtube\.com$/.test(new URL(u).hostname); } catch { return false; } };

  function ytJson(html){
    const i = html.search(/ytInitialData\s*=\s*\{/);
    if (i < 0) return null;
    const s = html.indexOf('{', i);
    let depth = 0, inStr = false, esc = false;
    for (let k = s; k < html.length; k++){
      const c = html[k];
      if (inStr){ if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') inStr = true;
      else if (c === '{') depth++;
      else if (c === '}' && --depth === 0){
        try { return JSON.parse(html.slice(s, k + 1)); } catch { return null; }
      }
    }
    return null;
  }

  function ytVideos(root){
    const out = [], seen = new Set();
    const txt = t => !t ? '' : (t.simpleText || (t.runs || []).map(r => r.text).join('') || t.content || '');
    (function walk(o){
      if (!o || typeof o !== 'object') return;
      if (Array.isArray(o)){ o.forEach(walk); return; }
      let id = '', title = '', meta = '';
      if (typeof o.videoId === 'string' && o.title && (o.thumbnail || o.lengthText || o.ownerText || o.shortBylineText)){
        id = o.videoId; title = txt(o.title);
        meta = [txt(o.ownerText || o.shortBylineText), txt(o.viewCountText || o.shortViewCountText), txt(o.publishedTimeText)].filter(Boolean).join(' \u2022 ');
      } else if (o.contentType === 'LOCKUP_CONTENT_TYPE_VIDEO' && o.contentId){
        const m = o.metadata && o.metadata.lockupMetadataViewModel;
        id = o.contentId; title = m && m.title ? m.title.content : '';
        const rows = (m && m.metadata && m.metadata.contentMetadataViewModel && m.metadata.contentMetadataViewModel.metadataRows) || [];
        meta = rows.map(r => (r.metadataParts || []).map(p => p.text && p.text.content).filter(Boolean).join(' \u2022 ')).filter(Boolean).join(' \u2022 ');
      }
      if (id && title && !seen.has(id)){ seen.add(id); out.push({ id, title, meta }); }
      for (const k in o) walk(o[k]);
    })(root);
    return out;
  }

  const isDDGHome = u => { try { const x = new URL(u); return /^(www\.)?duckduckgo\.com$/.test(x.hostname) && x.pathname === '/' && !x.searchParams.get('q'); } catch { return false; } };
  function renderDDG(){
    pageEl.innerHTML = '';
    const w = document.createElement('div'); w.className = 'ddg';
    const l = document.createElement('div'); l.className = 'ddg-logo'; l.textContent = 'DuckDuckGo';
    const i = document.createElement('input'); i.type = 'text'; i.placeholder = 'Search the web'; i.setAttribute('aria-label', 'Search');
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Search';
    const run = () => { const q = i.value.trim(); if (q) navigate(/^https?:\/\//i.test(q) ? q : 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(q)); };
    b.onclick = run; i.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    w.append(l, i, b); pageEl.append(w); i.focus();
  }

  function renderYouTube(html, base){
    const u = new URL(base);
    const vid = u.pathname === '/watch' ? u.searchParams.get('v')
              : ((/^\/(shorts|embed|live)\/([\w-]{6,})/.exec(u.pathname) || [])[2] || null);
    const data = ytJson(html);
    const vids = (data ? ytVideos(data) : []).filter(v => v.id !== vid);

    pageEl.innerHTML = '';
    const root = document.createElement('div'); root.className = 'yt';

    // header: logo + search
    const head = document.createElement('div'); head.className = 'yt-head';
    const logo = document.createElement('a'); logo.className = 'yt-logo'; logo.dataset.go = 'https://www.youtube.com/';
    logo.innerHTML = '<svg width="34" height="24" viewBox="0 0 34 24" aria-hidden="true"><rect width="34" height="24" rx="7" fill="#f00"/><path d="M13.5 6.8v10.4L22.5 12z" fill="#fff"/></svg><span>YouTube</span>';
    const sw = document.createElement('div'); sw.className = 'yt-search';
    const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = 'Search YouTube';
    inp.value = u.pathname === '/results' ? (u.searchParams.get('search_query') || '') : '';
    const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'Search';
    const run = () => { const q = inp.value.trim(); if (q) navigate('https://www.youtube.com/results?search_query=' + encodeURIComponent(q)); };
    btn.onclick = run; inp.addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
    sw.append(inp, btn); head.append(logo, sw); root.append(head);

    // player for watch pages (loaded straight from YouTube's embed, not the Worker)
    if (vid){
      const box = document.createElement('div'); box.className = 'yt-player';
      const f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(vid);
      f.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen';
      f.allowFullscreen = true; f.title = 'YouTube video player'; f.referrerPolicy = 'strict-origin-when-cross-origin';
      box.append(f); root.append(box);
      const ext = document.createElement('a'); ext.href = 'https://www.youtube.com/watch?v=' + encodeURIComponent(vid); ext.target = '_blank'; ext.rel = 'noopener'; ext.textContent = 'Player not loading? Open on youtube.com'; ext.style.cssText = 'display:inline-block;margin-top:8px;font-size:.85rem';
      root.append(ext);
      const tm = /<title[^>]*>([^<]*)/i.exec(html);
      if (tm){
        const h = document.createElement('div'); h.className = 'yt-title';
        h.textContent = new DOMParser().parseFromString(tm[1], 'text/html').documentElement.textContent.replace(/\s*-\s*YouTube\s*$/, '');
        root.append(h);
      }
    }

    if (vids.length){
      const grid = document.createElement('div'); grid.className = 'yt-grid';
      vids.forEach(v => {
        const a = document.createElement('a'); a.className = 'yt-card'; a.dataset.go = 'https://www.youtube.com/watch?v=' + v.id;
        const im = document.createElement('img'); im.src = 'https://i.ytimg.com/vi/' + v.id + '/mqdefault.jpg';
        im.loading = 'lazy'; im.alt = ''; im.setAttribute('referrerpolicy', 'no-referrer');
        const t = document.createElement('div'); t.className = 't'; t.textContent = v.title;
        const m = document.createElement('div'); m.className = 'm'; m.textContent = v.meta;
        a.append(im, t, m); grid.append(a);
      });
      root.append(grid);
    } else if (!vid){
      const e = document.createElement('div'); e.className = 'yt-empty';
      e.textContent = data ? 'No videos on this page. Try searching above.' : 'YouTube sent no video data for this page. Try searching above.';
      root.append(e);
    }
    pageEl.append(root);
  }

  // ---------- generic pages ----------
  function firstSrcsetUrl(srcset){
    if (!srcset) return '';
    return srcset.split(',')[0].trim().split(/\s+/)[0] || '';
  }
  function bestImgSrc(el){
    const direct = el.getAttribute('src');
    if (direct && !/^data:image\/(gif|png);base64,?$|^$/.test(direct.trim())) return direct;
    for (const attr of ['data-src', 'data-original', 'data-lazy-src', 'data-lazy', 'data-srcset', 'srcset']){
      const v = el.getAttribute(attr);
      if (!v) continue;
      return attr.includes('srcset') ? firstSrcsetUrl(v) : v;
    }
    return direct || '';
  }

  function render(html, base, searchEngine, query){
    if (isYouTube(base)){ renderYouTube(html, base); return; }
    if (isDDGHome(base)){ renderDDG(); return; }
    const doc = new DOMParser().parseFromString(html, 'text/html');
    if (searchEngine){
      const results = searchEngine === 'ddg' ? extractDuckDuckGoResults(doc, base) : searchEngine === 'bing' ? extractBingResults(doc, base) : extractGoogleResults(doc, base);
      if (results.length){ renderResults(results); return; }
    }
    doc.querySelectorAll('script,style,iframe,frame,object,embed,link,meta,base,noscript,svg,canvas,template').forEach(n => n.remove());
    if (!$('imgs').checked) doc.querySelectorAll('img,picture,source,video,audio').forEach(n => n.remove());
    doc.querySelectorAll('*').forEach(el => {
      const rawSrc = el.tagName === 'IMG' ? bestImgSrc(el) : null;
      for (const a of [...el.attributes]){
        const n = a.name.toLowerCase();
        if (n.startsWith('on') || ['style','srcset','class','id'].includes(n)) el.removeAttribute(a.name);
      }
      if (el.tagName === 'A'){
        const h = resolveHref(el.getAttribute('href') || '', base);
        el.removeAttribute('href'); if (h) el.dataset.go = h;
      } else if (el.tagName === 'FORM'){
        el.dataset.action = resolveHref(el.getAttribute('action') || '', base) || base;
        ['action','method','target','enctype'].forEach(n => el.removeAttribute(n));
      } else if (el.tagName === 'IMG'){
        const s = resolveHref(rawSrc || '', base);
        if (s){ el.setAttribute('src', s); el.setAttribute('referrerpolicy','no-referrer'); } else el.remove();
      }
    });
    pageEl.innerHTML = '';
    pageEl.append(...doc.body.childNodes);
  }

  function openNative(input, push){
    const t = input.trim();
    const url = looksLikeUrl(t) ? (/^https?:\/\//i.test(t) ? t : 'https://' + t) : 'https://www.bing.com/search?q=' + encodeURIComponent(t);
    const base = $('wurl').value.trim().replace(/\?.*$/, '');
    $('frame').src = base + '?k=' + encodeURIComponent($('wkey').value) + '&url=' + encodeURIComponent(url);
    if (push) hist.push(url);
    $('q').value = url;
    $('note').textContent = 'Native view: ' + new URL(url).hostname + ' loaded through your Worker.'; $('note').className = 'note';
  }
  window.addEventListener('message', e => {
    if (e.source === $('frame').contentWindow && e.data && e.data.uniBlok) $('q').value = e.data.uniBlok;
  });

  async function navigate(input, push = true){
    const worker = $('wurl').value.trim(), key = $('wkey').value;
    if (!worker || !key){ $('settings').open = true; showMsg('Enter your Worker address and key first.', true); return; }
    store.set('wurl', worker); store.set('wkey', key);
    const u0 = toUrl(input);
    const nat = $('native').checked && !isYouTube(u0) && !/^https:\/\/(www\.bing\.com\/search|html\.duckduckgo\.com\/html)/.test(u0);
    $('frame').style.display = nat ? 'block' : 'none'; $('viewport').style.display = nat ? 'none' : '';
    if (nat) return openNative(input, push);
    let url = toUrl(input);
    if (/^https:\/\/(www\.)?duckduckgo\.com\/(\?|$)/.test(url)){
      const dq = new URL(url).searchParams.get('q');
      if (dq) url = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(dq);
    }
    const searchEngine = /^https:\/\/html\.duckduckgo\.com\/html\//.test(url) ? 'ddg'
                        : /^https:\/\/www\.bing\.com\/search/.test(url) ? 'bing'
                        : /^https:\/\/www\.google\.[a-z.]+\/search/.test(url) ? 'google'
                        : null;
    const domain = new URL(url).hostname;
    $('note').textContent = 'Fetching…'; $('note').className = 'note'; showMsg('Loading…');
    try{
      const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 30000);
      const headers = {'x-key': key};
      if ($('cookies').checked){
        const c = jar.getHeader(domain);
        if (c) headers['x-cookie'] = c;
      }
      const r = await fetch(worker + encodeURIComponent(url), {headers, signal: ctl.signal});
      clearTimeout(t);
      if (r.status === 401) throw new Error('Wrong Worker key. Check the Worker settings above.');
      if ($('cookies').checked){
        const sc = r.headers.get('x-set-cookie');
        if (sc){ try{ jar.merge(domain, JSON.parse(sc)); }catch{} }
      }
      let text = await r.text();
      // YouTube pages are huge and the video data sits deep inside them
      const limit = isYouTube(url) ? 6000000 : 1500000;
      if (text.length > limit) text = text.slice(0, limit);
      const type = r.headers.get('content-type') || '';
      if (!r.ok && !/html/.test(type)){
        throw new Error('Worker error (' + r.status + '): ' + text.slice(0, 200));
      }
      if (/json|plain/.test(type) && !/html/.test(type)){
        pageEl.innerHTML = ''; const pre = document.createElement('pre'); pre.style.whiteSpace = 'pre-wrap'; pre.textContent = text; pageEl.append(pre);
      } else if (/html|xml/.test(type)) render(text, url, searchEngine, input);
      else throw new Error('That address is a file, not a page.');
      if (push) hist.push(url);
      $('q').value = searchEngine ? (new URL(url)).searchParams.get('q') || url : url;
      if (!r.ok){
        $('note').textContent = domain + ' responded with status ' + r.status + ' — the page below may be incomplete, a block/rate-limit page, or empty.';
        $('note').className = 'note err';
      } else {
        $('note').textContent = 'Fetched through your Cloudflare Worker.' + ($('cookies').checked ? ' Cookies on for ' + domain + '.' : '');
      }
    }catch(e){
      const msg = e.name === 'AbortError' ? 'The Worker took too long to respond.' :
                  e.message === 'Failed to fetch' ? 'Could not reach the Worker. Check the Worker address in Worker settings matches the live Worker, and that it is deployed.' :
                  e.message;
      showMsg(msg, true);
      $('note').textContent = msg; $('note').className = 'note err';
    }
  }

  shadow.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a');
    if (a && a.dataset.go){ e.preventDefault(); navigate(a.dataset.go); }
  });
  shadow.addEventListener('submit', e => {
    const f = e.target; e.preventDefault();
    if (!f || !f.dataset || !f.dataset.action) return;
    try{
      const u = new URL(f.dataset.action);
      for (const [k, v] of new FormData(f)) if (typeof v === 'string') u.searchParams.set(k, v);
      navigate(u.href);
    }catch{}
  });
  $('go').onclick = () => { if ($('q').value.trim()) navigate($('q').value); };
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
  $('back').onclick = () => { if ($('frame').style.display === 'block'){ $('frame').contentWindow.postMessage({uniBack: 1}, '*'); return; } if (hist.length > 1){ hist.pop(); navigate(hist.pop(), true); } };
})();
</script>
</body>
</html>
